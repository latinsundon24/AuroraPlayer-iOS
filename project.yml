name: AuroraPlayer

options:
  bundleIdPrefix: com.myplayer
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"

targets:
  AuroraPlayer:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: AuroraPlayer
        excludes:
          - "Resources/demo.m3u"
      - path: AuroraPlayer/Resources/demo.m3u
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myplayer.aurora
        PRODUCT_NAME: AuroraPlayer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    info:
      path: AuroraPlayer/Info.plist
      properties:
        CFBundleDisplayName: 极光播放器
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # 注意：一旦出现 NSAllowsArbitraryLoadsInWebContent / NSAllowsLocalNetworking /
          # NSAllowsArbitraryLoadsForMedia，iOS 10+ 会忽略 NSAllowsArbitraryLoads，
          # 导致 http:// 频道和 127.0.0.1 本地 HLS 都被 ATS 拦截（表现为 CoreMediaErrorDomain）。
          # 这里只保留全局开关。
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false

  AuroraPlayerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
        excludes:
          - "Fixtures"
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: AuroraPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AuroraPlayer.app/AuroraPlayer"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AuroraPlayer:
    build:
      targets:
        AuroraPlayer: all
    run:
      config: Release
    test:
      config: Debug
      targets:
        - AuroraPlayerTests
    archive:
      config: Release
